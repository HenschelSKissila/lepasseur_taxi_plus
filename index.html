<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LE PASSEUR TAXI+</title>
    <meta name="description" content="Gérer, suivre et rentabiliser vos taxis : recettes, dépenses, chauffeurs, salaires et retour sur investissement en FCFA." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0B5C30" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TAXI+" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" />
    <link rel="icon" href="/icons/favicon-64.png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Thème appliqué avant le premier rendu pour éviter un flash clair/sombre.
      try {
        var t = localStorage.getItem("lptp-theme") || "auto";
        var d = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = d ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Activez JavaScript pour utiliser LE PASSEUR TAXI+.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
